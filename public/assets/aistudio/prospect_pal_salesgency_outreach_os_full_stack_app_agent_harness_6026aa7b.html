<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prospect PAL — SalesGency Outreach OS (Full-Stack App & Agent Harness)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Prospect PAL Canonical Ink & Paper Palette */
      --ink-900: #0B0F16;
      --ink-800: #101B2D;
      --ink-700: #1B2942;
      --ink-600: #2B3A55;
      --ink-500: #4A5872;
      --ink-400: #6E7B93;
      --ink-300: #98A2B3;
      --ink-200: #C4CBD8;
      --ink-100: #E2E6EE;

      --paper-0: #FFFFFF;
      --paper-50: #FBFAF8;
      --paper-100: #F5F4F0;
      --paper-200: #EDEBE5;
      --paper-300: #DFDCD4;

      --cobalt-50: #EEF2FF;
      --cobalt-100: #DCE4FF;
      --cobalt-200: #B9C8FF;
      --cobalt-300: #8DA4FF;
      --cobalt-400: #5E7BFF;
      --cobalt-500: #3A56E4;
      --cobalt-600: #2A41C9;
      --cobalt-700: #1F32A2;
      --cobalt-800: #19287E;
      --cobalt-900: #16215E;

      --champagne-50: #FBF6EA;
      --champagne-100: #F5E9C8;
      --champagne-200: #E8D298;
      --champagne-300: #D9B968;
      --champagne-400: #C79E3E;
      --champagne-500: #A87F27;

      --signal-verified: #0E7C66;
      --signal-verified-bg: #E6F4F0;
      --signal-attention: #B4690E;
      --signal-attention-bg: #FCF3E4;
      --signal-blocked: #B3261E;
      --signal-blocked-bg: #FCEDEC;
      --signal-info: #2033A2;
      --signal-info-bg: #EEF2FF;

      --stage-trigger: #2A41C9;
      --stage-data: #0E7C66;
      --stage-shield: #1B6B93;
      --stage-ai: #6B3FA0;

      --font-display: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-editorial: 'Instrument Serif', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-data: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

      --shadow-hairline: 0 1px 2px rgba(11, 15, 22, 0.04);
      --shadow-card: 0 1px 3px rgba(11, 15, 22, 0.05), 0 8px 24px -6px rgba(16, 27, 45, 0.06);
      --shadow-elevated: 0 12px 36px -8px rgba(11, 15, 22, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--paper-100);
      color: var(--ink-900);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--cobalt-600); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, select, textarea { font-family: inherit; }

    /* Top Mode Bar */
    .dev-switcher {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--ink-900);
      color: var(--ink-100);
      border-bottom: 1px solid var(--ink-700);
      padding: 7px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
    }
    .dev-switcher-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .dev-switcher-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(217, 185, 104, 0.14);
      color: var(--champagne-300);
      font-family: var(--font-data);
      font-size: 11px;
      font-weight: 500;
    }
    .dev-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .dev-tab {
      background: transparent;
      color: var(--ink-300);
      border: 1px solid transparent;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .dev-tab:hover { color: var(--paper-0); background: rgba(255,255,255,0.06); }
    .dev-tab.active {
      background: var(--cobalt-600);
      color: var(--paper-0);
      border-color: var(--cobalt-400);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 600;
      font-size: 13.5px;
      padding: 8px 15px;
      border-radius: 9px;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      text-decoration: none !important;
    }
    .btn-sm { padding: 5px 11px; font-size: 12.5px; border-radius: 7px; }
    .btn-lg { padding: 11px 20px; font-size: 14.5px; border-radius: 10px; }
    .btn-primary { background: var(--ink-800); color: var(--paper-0); border-color: var(--ink-800); }
    .btn-primary:hover { background: var(--ink-700); }
    .btn-accent { background: var(--cobalt-600); color: var(--paper-0); border-color: var(--cobalt-600); }
    .btn-accent:hover { background: var(--cobalt-500); }
    .btn-outline { background: var(--paper-0); color: var(--ink-800); border-color: var(--paper-300); }
    .btn-outline:hover { border-color: var(--ink-400); background: var(--paper-50); }
    .btn-ghost { background: transparent; color: var(--ink-600); border-color: transparent; }
    .btn-ghost:hover { background: rgba(16, 27, 45, 0.06); color: var(--ink-900); }
    .btn-inverse { background: var(--paper-0); color: var(--ink-900); border-color: var(--paper-0); }
    .btn-inverse:hover { background: var(--paper-100); }
    .btn-champagne { background: var(--champagne-300); color: var(--ink-900); border-color: var(--champagne-300); }
    .btn-champagne:hover { background: var(--champagne-200); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Badges & Status Pills */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
    }
    .badge-mono { font-family: var(--font-data); font-weight: 500; }
    .badge-neutral { background: var(--paper-200); color: var(--ink-600); }
    .badge-verified { background: var(--signal-verified-bg); color: var(--signal-verified); }
    .badge-attention { background: var(--signal-attention-bg); color: var(--signal-attention); }
    .badge-blocked { background: var(--signal-blocked-bg); color: var(--signal-blocked); }
    .badge-brand { background: var(--cobalt-50); color: var(--cobalt-700); border: 1px solid var(--cobalt-100); }
    .badge-premium { background: var(--champagne-50); color: var(--champagne-500); border: 1px solid var(--champagne-200); }
    .badge-dark { background: rgba(255,255,255,0.08); color: var(--ink-100); border: 1px solid var(--ink-600); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      font-family: var(--font-data);
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .pulse .status-dot { animation: pulseDot 1.8s infinite; }

    /* Marketing Header */
    .mk-header {
      position: sticky;
      top: 37px;
      z-index: 100;
      background: rgba(251, 250, 248, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--paper-200);
    }
    .mk-header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      color: var(--ink-900);
      cursor: pointer;
    }
    .brand-cube {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--ink-800);
      color: var(--champagne-300);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-data);
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--ink-600);
    }

    /* App Layout */
    .app-shell {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      height: calc(100vh - 37px);
      background: var(--paper-100);
    }
    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 1fr; height: auto; min-height: calc(100vh - 37px); }
    }
    .app-sidebar {
      background: var(--paper-50);
      border-right: 1px solid var(--paper-200);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .nav-group-label {
      padding: 0 10px 4px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-400);
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--ink-600);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.12s ease;
    }
    .nav-item:hover { background: var(--paper-200); color: var(--ink-900); }
    .nav-item.active {
      background: var(--cobalt-50);
      color: var(--cobalt-700);
      font-weight: 600;
    }
    .nav-badge {
      margin-left: auto;
      font-family: var(--font-data);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--paper-200);
      color: var(--ink-600);
    }
    .nav-item.active .nav-badge {
      background: var(--cobalt-100);
      color: var(--cobalt-700);
    }

    .app-main-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .app-topbar {
      height: 56px;
      background: var(--paper-0);
      border-bottom: 1px solid var(--paper-200);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .app-viewport {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    /* Cards & Inputs */
    .card {
      background: var(--paper-0);
      border: 1px solid var(--paper-200);
      border-radius: 14px;
      box-shadow: var(--shadow-card);
    }
    .input-box {
      width: 100%;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1.5px solid var(--paper-300);
      background: var(--paper-0);
      color: var(--ink-900);
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .input-box:focus { border-color: var(--cobalt-500); }

    /* Code Viewer */
    .code-viewer {
      background: var(--ink-900);
      color: #E2E8F0;
      border: 1px solid var(--ink-700);
      border-radius: 12px;
      padding: 16px;
      font-family: var(--font-data);
      font-size: 12px;
      line-height: 1.55;
      overflow-x: auto;
      max-height: 420px;
      overflow-y: auto;
      white-space: pre;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(11, 15, 22, 0.62);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-panel {
      background: var(--paper-0);
      border: 1px solid var(--paper-200);
      border-radius: 16px;
      box-shadow: var(--shadow-elevated);
      width: 100%;
      max-width: 860px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toast-banner {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 600;
      background: var(--ink-800);
      color: var(--paper-0);
      border: 1px solid var(--champagne-400);
      padding: 11px 16px;
      border-radius: 10px;
      box-shadow: var(--shadow-elevated);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>

    function downloadTextFile(filename, content, mime = 'application/json') {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 150);
      showToast(`Downloaded ${filename}`);
    }

    function runEmailLinter(subject, body, mode) {
      const violations = [];
      let cleaned = (body || '').trim();
      if (mode === 'body_only') {
        cleaned = cleaned
          .replace(/^(hi|hey|hello|dear)\s+[^,\n]+[,:]?\s*/i, '')
          .replace(/\n+(best|cheers|regards|thanks|sincerely)[,\s][\s\S]*$/i, '')
          .trim();
      }
      const words = cleaned.split(/\s+/).filter(Boolean);
      if (words.length > 120) violations.push(`Exceeds max_words (${words.length} / 120 words)`);
      if (/^(re:|fwd:|fw:)/i.test((subject || '').trim())) violations.push('Blocks fake Re: / Fwd: subject prefix');
      if (cleaned.includes('!') || (subject || '').includes('!')) violations.push('Blocks exclamation marks (!) in subject or body');
      if (/https?:\/\/|www\./i.test(cleaned)) violations.push('Blocks raw links/URLs inside cold email body');
      if (/\{\{[^}]+\}\}|\[[A-Z0-9_\s]+\]/.test(cleaned)) violations.push('Blocks unreplaced {{placeholder}} or [TOKEN]');
      return {
        passed: violations.length === 0,
        words: words.length,
        cleaned,
        violations
      };
    }

      const spec = STEPS.map((name, i) => {
        const v = specVal[i];
        const sk = skipped && i < 2;
        return {
          num: '0' + (i + 1),
          name,
          value: sk ? 'Skipped — leads provided (leads_json)' : v || 'Waiting for your answer',
          tone: sk ? 'neutral' : v ? 'verified' : 'attention',
          state: sk ? 'skipped' : v ? 'bound' : 'open'

);

  env_key text not null, -- ENV:ANTHROPIC_API_KEY, ENV:COMPOSIO_API_KEY, ENV:N8N_BASE_URL, X-PAE-Key

);

create table public.lead_events (

      const doCode = `// Cloudflare Durable Object BuildSession + Vercel AI SDK Tools
export class BuildSessionDurableObject {
  private answers: CampaignAnswers = {};

  async handleChatTurn(userMessage: string) {
    return streamText({
      model: anthropic('claude-3-7-sonnet-latest'),
      system: SYSTEM_PROMPT,
      messages: [{ role: 'user', content: userMessage }],
      tools: {
        bind_slot: tool({
          parameters: z.object({
            slot: z.enum(['goal','start','icp','companies','contacts','research','email','outreach','platform','schedule']),
            value: z.string(),
          }),
          execute: async ({ slot, value }) => {
            this.answers[slot] = value;
            return { bound: slot, settings: resolveEngineSettings(this.answers) };
          },
        }),
        skip_steps: tool({
          parameters: z.object({ steps: z.array(z.number()), reason: z.string() }),
          execute: async ({ steps, reason }) => ({ skipped_steps: steps, reason, start_mode: 'leads_provided' }),
        }),
        compile_engine: tool({
          parameters: z.object({ confirm_dry_run: z.boolean().default(true) }),
          execute: async () => ({
            status: 'approved',
            dry_run: true,
            mainWorkflow: compileN8nMainWorkflow(this.answers),
            errorWorkflow: compileN8nErrorWorkflow(this.answers),
            skills: compileSkillPack(this.answers),
          }),
        }),
      },
    });
  }
}`;

      const connectedCount = Object.values(STATE.connected).filter(Boolean).length;

      return `
        <div class="app-shell">
          <aside class="app-sidebar">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 6px">
              <div class="brand-mark" data-action="nav-screen" data-screen="marketing">
                <div class="brand-cube">PP</div>
                <span>Prospect PAL</span>
              </div>
              <span class="badge badge-neutral badge-mono">v2.4</span>
            </div>

            <div>
              <button class="nav-item ${STATE.view === 'dashboard' ? 'active' : ''}" data-action="nav-app" data-view="dashboard">
                ${iconSvg('layout-dashboard', 17)} <span>Dashboard</span>
              </button>
            </div>

            <div style="display:flex;flex-direction:column;gap:2px">
              <div class="nav-group-label">Build</div>
              <button class="nav-item ${STATE.view === 'agent' ? 'active' : ''}" data-action="nav-app" data-view="agent">
                ${iconSvg('wand-sparkles', 17)} <span>Build agent</span>
              </button>
              <button class="nav-item ${STATE.view === 'gtm_command' ? 'active' : ''}" data-action="nav-app" data-view="gtm_command">
                ${iconSvg('shield-check', 17)} <span>GTM Command &amp; Replies</span> <span class="nav-badge">07</span>
              </button>
              <button class="nav-item ${STATE.view === 'campaigns' ? 'active' : ''}" data-action="nav-app" data-view="campaigns">
                ${iconSvg('calendar-clock', 17)} <span>Campaigns</span> <span class="nav-badge">${STATE.campaigns.length}</span>
              </button>
              <button class="nav-item ${STATE.view === 'skills' ? 'active' : ''}" data-action="nav-app" data-view="skills">
                ${iconSvg('package', 17)} <span>Skills</span> <span class="nav-badge">8</span>
              </button>
            </div>

            <div style="display:flex;flex-direction:column;gap:2px">
              <div class="nav-group-label">Connect &amp; Deploy</div>
              <button class="nav-item ${STATE.view === 'connectors' ? 'active' : ''}" data-action="nav-app" data-view="connectors">
                ${iconSvg('plug', 17)} <span>Connectors</span> <span class="nav-badge">${connectedCount}</span>
              </button>
              <button class="nav-item ${STATE.view === 'keys' ? 'active' : ''}" data-action="nav-app" data-view="keys">
                ${iconSvg('key-round', 17)} <span>Keys &amp; instances</span>
              </button>
              <button class="nav-item ${STATE.view === 'architecture' ? 'active' : ''}" data-action="nav-app" data-view="architecture">
                ${iconSvg('code', 17)} <span>Backend &amp; ROSTR</span>
              </button>
            </div>

            <div style="margin-top:auto;padding:12px;border-radius:10px;background:var(--paper-100);border:1px solid var(--paper-200);font-size:12px">
              <div style="font-weight:700;color:var(--ink-800)">SalesGency Workspace</div>
              <div style="color:var(--ink-400);margin-top:2px">Patrick Diamitani · Pro Plan</div>
              <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center">
                <span class="badge badge-verified badge-mono">Vault Active</span>
                <a href="#" data-action="nav-screen" data-screen="marketing" style="font-size:11.5px;font-weight:600">Marketing site ↗</a>
              </div>
            </div>
          </aside>

          <div class="app-main-col">
            <header class="app-topbar">
              <div style="display:flex;align-items:center;gap:10px">
                <span style="font-weight:700;font-size:15px">${esc(titles[STATE.view] || 'Workspace')}</span>
                <span class="badge badge-neutral badge-mono">dry_run default: true</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <span class="badge badge-verified">${iconSvg('shield-check', 13)} Step 01–06 Guardrails Active</span>
                <button class="btn btn-outline btn-sm" data-action="nav-app" data-view="agent">${iconSvg('wand-sparkles', 13)} New build</button>
              </div>
            </header>

            <main class="app-viewport">
              ${STATE.view === 'dashboard' ? renderDashboardView() : ''}
              ${STATE.view === 'agent' ? (STATE.agentMode === 'intake' ? renderIntakeArchitectView() : renderLegacy10QAgentView()) : ''}
              ${STATE.view === 'campaigns' ? renderCampaignsView() : ''}
              ${STATE.view === 'skills' ? renderSkillsView() : ''}
              ${STATE.view === 'connectors' ? renderConnectorsView() : ''}
              ${STATE.view === 'keys' ? renderKeysView() : ''}
              ${STATE.view === 'architecture' ? renderArchitectureView() : ''}
              ${STATE.view === 'gtm_command' ? renderGtmCommandView() : ''}
            </main>
          </div>
        </div>
      `;
    }

    function renderRunModal() {
      if (STATE.activeRunModal == null) return '';
      const run = STATE.runs[STATE.activeRunModal];
      if (!run) return '';
      return `
        <div class="modal-backdrop" data-action="close-run-modal">
          <div class="modal-panel" onclick="event.stopPropagation()">
            <div style="padding:18px 24px;border-bottom:1px solid var(--paper-200);display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="display:flex;align-items:center;gap:8px">
                  <span style="font-family:var(--font-data);font-weight:700;color:var(--cobalt-600)">${esc(run.id)}</span>
                  <span style="font-weight:700;font-size:16px">${esc(run.campaign)}</span>
                  <span class="badge badge-${run.tone} badge-mono">${esc(run.flag)}</span>
                </div>
                <div style="font-size:12.5px;color:var(--ink-500);margin-top:2px">${esc(run.summary)}</div>
              </div>
              <button class="btn btn-ghost btn-sm" data-action="close-run-modal">${iconSvg('x', 16)} Close</button>
            </div>
            <div style="padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px">
              ${(run.leads || []).map((lead, lIdx) => `
                <div class="card" style="padding:16px;background:var(--paper-50);display:flex;flex-direction:column;gap:8px">
                  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                    <div>
                      <span style="font-weight:700;font-size:14.5px">${esc(lead.company)}</span>
                      <span style="font-family:var(--font-data);font-size:12px;color:var(--ink-400);margin-left:6px">fit_score: ${lead.score} · ${esc(lead.contact)} (${esc(lead.email)})</span>
                    </div>
                    <div style="display:flex;gap:6px;align-items:center">
                      <span class="badge badge-${lead.tone} badge-mono">${esc(lead.status)}</span>
                      ${lead.status === 'needs_review' ? `
                        <button class="btn btn-accent btn-sm" data-action="approve-review-lead" data-run-idx="${STATE.activeRunModal}" data-lead-idx="${lIdx}">Approve &amp; Queue</button>
                      ` : ''}
                    </div>
                  </div>
                  <div style="font-family:var(--font-data);font-size:12px;color:var(--ink-600)">
                    <strong>Step 04 Hook:</strong> ${esc(lead.hook)} ${lead.evidenceUrl ? `— <span style="color:var(--cobalt-600)">${esc(lead.evidenceUrl)}</span>` : ''}
                  </div>
                  <div style="background:var(--paper-0);border:1px solid var(--paper-200);border-radius:8px;padding:10px 12px;font-size:13px;white-space:pre-wrap">${esc(lead.body)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ============================================================================
    // 7. MASTER RENDER & EVENT DELEGATION
    // ============================================================================
    function render() {
      const root = document.getElementById('app');
      if (!root) return;
      let bodyHtml = renderTopSwitcher();
      if (STATE.screen === 'marketing') bodyHtml += renderMarketingScreen();
      else if (STATE.screen === 'signin' || STATE.screen === 'signup') bodyHtml += renderAuthScreen();
      else bodyHtml += renderAppScreen();

      bodyHtml += renderRunModal();
      if (STATE.toast) {
        bodyHtml += `<div class="toast-banner">${iconSvg('circle-check', 16, 'var(--champagne-300)')}<span>${esc(STATE.toast)}</span></div>`;
      }
      root.innerHTML = bodyHtml;
    }

    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.getAttribute('data-action');

      if (action === 'nav-screen') {
        e.preventDefault();
        STATE.screen = el.getAttribute('data-screen') || 'marketing';
        render();
      } else if (action === 'nav-app') {
        e.preventDefault();
        STATE.screen = 'app';
        STATE.view = el.getAttribute('data-view') || 'dashboard';
        render();
      } else if (action === 'pick-hero-idea') {
        STATE.heroPrompt = el.getAttribute('data-idea') || '';
        render();
      } else if (action === 'hero-start-build') {
        const inp = document.getElementById('hero-prompt-input');
        const val = inp ? inp.value.trim() : STATE.heroPrompt.trim();
        STATE.screen = 'app';
        STATE.view = 'agent';
        resetAgentChat();
        render();
        if (val) setTimeout(() => submitAgentAnswer(val), 60);
      } else if (action === 'run-teardown') {
        const d = document.getElementById('td-domain-input');
        const p = document.getElementById('td-persona-input');
        const o = document.getElementById('td-offer-input');
        if (d) STATE.tdDomain = d.value;
        if (p) STATE.tdPersona = p.value;
        if (o) STATE.tdOffer = o.value;
        runFreeTeardown();
      } else if (action === 'load-teardown-into-agent') {
        if (STATE.tdResult) {
          STATE.screen = 'app';
          STATE.view = 'agent';
          STATE.answers = {
            goal: `Reach ${STATE.tdPersona} at companies like ${STATE.tdResult.company}`,
            start: 'No, start from my ICP',
            icp: STATE.tdResult.icpSummary,
            companies: 'HubSpot',
            contacts: 'Clay',
            research: 'Web search via Exa',
            email: 'Full email',
            outreach: 'Smartlead sequence',
            platform: 'n8n',
            schedule: 'Weekdays 08:00'
          };
          STATE.qi = QS.length;
          STATE.done = true;
          showToast('Loaded teardown into Build Agent & compiled');
          render();
        }
      } else if (action === 'copy-teardown-email') {
        if (STATE.tdResult) copyText(STATE.tdResult.emailFull, 'Copied full email draft');
      } else if (action === 'copy-teardown-token') {
        if (STATE.tdResult) copyText(STATE.tdResult.emailBodyOnly, 'Copied {{email_1_body}} CRM token');
      } else if (action === 'select-step') {
        STATE.stepSel = parseInt(el.getAttribute('data-idx') || '0', 10);
        render();
      } else if (action === 'set-pricing-tab') {
        STATE.pricingTab = el.getAttribute('data-tab') || 'saas';
        render();
      } else if (action === 'complete-auth') {
        e.preventDefault();
        STATE.screen = 'app';
        STATE.view = STATE.pendingPrompt ? 'agent' : 'dashboard';
        render();
      } else if (action === 'pick-agent-chip') {
        submitAgentAnswer(el.getAttribute('data-chip') || '');
      } else if (action === 'send-agent-draft') {
        const inp = document.getElementById('agent-draft-input');
        if (inp) STATE.draft = inp.value;
        submitAgentAnswer(STATE.draft);
      } else if (action === 'agent-autofill') {
        autoCompleteAgentDemo();
      } else if (action === 'agent-attach-leads') {
        STATE.answers.goal = STATE.answers.goal || 'Outbound to uploaded CSV leads_json';
        STATE.answers.start = 'Yes, skip steps 1 and 2';
        STATE.qi = 4; // Jump directly to Contacts (Step 03)
        STATE.msgs.push({ role: 'user', text: '[Attached leads_json: 120 rows] Yes, skip steps 1 and 2' });
        STATE.msgs.push({ role: 'assistant', text: 'Skipping steps 1 and 2. Your leads go straight into Step 03 (Contacts) as leads_json. ' + QS[4].q });
        showToast('Attached leads_json — Steps 01 & 02 marked skipped');
        render();
      } else if (action === 'agent-reset') {
        resetAgentChat();
        render();
      } else if (action === 'set-compiler-tab') {
        STATE.compilerTab = el.getAttribute('data-tab') || 'n8n_main';
        render();
      } else if (action === 'copy-compiled-artifact') {
        const eff = getEffectiveAnswers();
        const text = STATE.compilerTab === 'n8n_main' ? compileMainWorkflowJSON(eff) : STATE.compilerTab === 'n8n_err' ? compileErrorWorkflowJSON(eff) : STATE.compilerTab === 'rostr' ? compileRostrConfigText(eff) : generateSkillMarkdown('prospect-outreach', eff);
        copyText(text, 'Copied compiled artifact to clipboard');
      } else if (action === 'download-compiled-artifact') {
        const eff = getEffectiveAnswers();
        const isMake = eff.platform === 'Make.com';
        if (STATE.compilerTab === 'n8n_main') downloadTextFile(isMake ? 'pae-main.blueprint.json' : 'pae-main.json', compileMainWorkflowJSON(eff));
        else if (STATE.compilerTab === 'n8n_err') downloadTextFile(isMake ? 'pae-error.blueprint.json' : 'pae-error-alert.json', compileErrorWorkflowJSON(eff));
        else if (STATE.compilerTab === 'rostr') downloadTextFile('rostr.config.ts', compileRostrConfigText(eff), 'text/plain');
        else downloadTextFile('SKILL.md', generateSkillMarkdown('prospect-outreach', eff), 'text/markdown');
      } else if (action === 'save-campaign') {
        saveCompiledCampaign(el.getAttribute('data-deploy') === '1');
      } else if (action === 'run-campaign') {
        triggerCampaignRun(el.getAttribute('data-id'));
      } else if (action === 'toggle-campaign-active') {
        const id = el.getAttribute('data-id');
        const c = STATE.campaigns.find(x => x.id === id);
        if (c) { c.active = !c.active; render(); }
      } else if (action === 'toggle-campaign-live') {
        toggleCampaignLiveMode(el.getAttribute('data-id'));
      } else if (action === 'download-campaign-json') {
        const id = el.getAttribute('data-id');
        const c = STATE.campaigns.find(x => x.id === id);
        downloadTextFile(`${(c ? c.name : 'campaign').toLowerCase().replace(/[^a-z0-9]+/g, '-')}-pae-main.json`, compileMainWorkflowJSON());
      } else if (action === 'select-skill') {
        STATE.activeSkillSlug = el.getAttribute('data-slug') || 'prospect-outreach';
        render();
      } else if (action === 'download-single-skill') {
        const slug = el.getAttribute('data-slug') || 'prospect-outreach';
        downloadTextFile(`${slug}-SKILL.md`, generateSkillMarkdown(slug), 'text/markdown');
      } else if (action === 'copy-single-skill') {
        const slug = el.getAttribute('data-slug') || 'prospect-outreach';
        copyText(generateSkillMarkdown(slug), `Copied ${slug}/SKILL.md`);
      } else if (action === 'download-all-skills') {
        const allMd = SKILLS.map(s => `# ==========================================\n# FILE: ${s[0]}/SKILL.md\n# ==========================================\n\n` + generateSkillMarkdown(s[0])).join('\n\n\n');
        downloadTextFile('prospect-pal-8-skills-bundle.md', allMd, 'text/markdown');
      } else if (action === 'set-linter-mode') {
        STATE.linterMode = el.getAttribute('data-mode') || 'full_email';
        render();
      } else if (action === 'set-connector-cat') {
        STATE.cat = el.getAttribute('data-cat') || 'All';
        render();
      } else if (action === 'toggle-connector') {
        const slug = el.getAttribute('data-slug');
        if (slug) {
          STATE.connected[slug] = !STATE.connected[slug];
          showToast(`${STATE.connected[slug] ? 'Connected' : 'Disconnected'} composio:${slug}`);
          render();
        }
      } else if (action === 'start-key-edit') {
        const env = el.getAttribute('data-env');
        const k = STATE.keys.find(x => x.env === env);
        STATE.editingKeyEnv = env;
        STATE.editingKeyVal = k ? k.value : '';
        render();
      } else if (action === 'save-key-edit') {
        const env = el.getAttribute('data-env');
        const inp = document.getElementById('key-edit-input');
        const val = inp ? inp.value.trim() : '';
        const k = STATE.keys.find(x => x.env === env);
        if (k) {
          k.value = val || '•••• rotated';
          k.set = true;
        }
        STATE.editingKeyEnv = null;
        showToast(`Encrypted & stored ${env} in Supabase Vault`);
        render();
      } else if (action === 'toggle-guardrail') {
        const key = el.getAttribute('data-key');
        if (key === 'allowWebhookLiveSend' || key === 'allowGuessedSends') {
          STATE[key] = !STATE[key];
          showToast(`Updated ${key} = ${STATE[key]}`);
          render();
        }
      } else if (action === 'save-optout-sig') {
        const inp = document.getElementById('optout-sig-input');
        if (inp) STATE.optOutSignature = inp.value;
        showToast('Updated Step 06 opt-out signature requirement');
        render();
      } else if (action === 'open-run-modal') {
        STATE.activeRunModal = parseInt(el.getAttribute('data-run-idx') || '0', 10);
        render();
      } else if (action === 'close-run-modal') {
        STATE.activeRunModal = null;
        render();
      } else if (action === 'approve-review-lead') {
        const rIdx = parseInt(el.getAttribute('data-run-idx') || '0', 10);
        const lIdx = parseInt(el.getAttribute('data-lead-idx') || '0', 10);
        const lead = STATE.runs[rIdx] && STATE.runs[rIdx].leads[lIdx];
        if (lead) {
          lead.status = 'approved_by_human';
          lead.tone = 'verified';
          showToast(`Approved ${lead.company} and queued for outreach`);
          render();
        }
      } else if (action === 'load-playbook') {
        const pbId = el.getAttribute('data-pb');
        const pb = GTM_PLAYBOOKS.find(p => p.id === pbId);
        if (pb) {
          STATE.activePlaybook = pb.id;
          STATE.selectedRuntime = pb.runtime;
          STATE.secConfigs = JSON.parse(JSON.stringify(pb.configs));
          showToast(`Loaded "${pb.name}" Playbook (${pb.badge}) on ${pb.runtime}`);
          render();
        }
      } else if (action === 'pick-reply-sample') {
        const idx = parseInt(el.getAttribute('data-idx') || '0', 10);
        if (REPLY_SAMPLES[idx]) {
          STATE.replySampleIdx = idx;
          STATE.replyInput = REPLY_SAMPLES[idx].text;
          render();
        }
      } else if (action === 'bind-registry-tool') {
        const secNum = parseInt(el.getAttribute('data-sec-num') || '1', 10);
        const slug = el.getAttribute('data-slug');
        const secIdx = Math.max(0, secNum - 1);
        const secObj = INTAKE_SECTIONS[secIdx];
        if (secObj && slug) {
          STATE.secConfigs[secObj.id].toolSlug = slug;
          STATE.activeSecIdx = secIdx;
          STATE.view = 'agent';
          STATE.agentMode = 'intake';
          showToast(`Bound ${slug} to Section 0${secNum} (${secObj.name})`);
          render();
        }
      } else if (action === 'select-runtime') {
        STATE.selectedRuntime = el.getAttribute('data-rt') || 'n8n';
        showToast(`Target runtime set to ${STATE.selectedRuntime}`);
        render();
      } else if (action === 'set-agent-mode') {
        STATE.agentMode = el.getAttribute('data-mode') || 'intake';
        render();
      } else if (action === 'select-intake-sec') {
        STATE.activeSecIdx = parseInt(el.getAttribute('data-idx') || '0', 10);
        render();
      } else if (action === 'run-enably-sec') {
        const secId = el.getAttribute('data-sec');
        const secObj = INTAKE_SECTIONS.find(s => s.id === secId);
        if (secObj && STATE.secConfigs[secId]) {
          STATE.secConfigs[secId].enablyUsed = true;
          STATE.secConfigs[secId].purpose = secObj.enablyOutput;
          showToast(`Enably Agent synthesized ${secObj.name} brief`);
          render();
        }
      } else if (action === 'select-sec-tool') {
        const secId = el.getAttribute('data-sec');
        const slug = el.getAttribute('data-slug');
        if (secId && slug && STATE.secConfigs[secId]) {
          STATE.secConfigs[secId].toolSlug = slug;
          showToast(`Bound ${slug} via /r/docs/${slug} schema`);
          render();
        }
      } else if (action === 'test-sec-v1') {
        const secId = el.getAttribute('data-sec');
        if (secId && STATE.secConfigs[secId]) {
          STATE.secConfigs[secId].v1Tested = true;
          STATE.secRightTab = 'v1test';
          showToast(`V1 Section Test passed for ${secId}`);
          render();
        }
      } else if (action === 'approve-sec-v1') {
        const secId = el.getAttribute('data-sec');
        if (secId && STATE.secConfigs[secId]) {
          STATE.secConfigs[secId].v1Tested = true;
          STATE.secConfigs[secId].approved = true;
          showToast(`Approved Section ${INTAKE_SECTIONS[STATE.activeSecIdx].num} V1 Spec`);
          if (STATE.activeSecIdx < INTAKE_SECTIONS.length - 1) {
            STATE.activeSecIdx += 1;
          }
          render();
        }
      } else if (action === 'set-sec-right-tab') {
        STATE.secRightTab = el.getAttribute('data-tab') || 'preview';
        render();
      } else if (action === 'download-sec-doc') {
        const idx = parseInt(el.getAttribute('data-idx') || '0', 10);
        const secObj = INTAKE_SECTIONS[idx] || INTAKE_SECTIONS[0];
        downloadTextFile(`SECTION-${secObj.num}-${secObj.id.toUpperCase()}-SPEC.md`, generateSectionDocMarkdown(idx), 'text/markdown');
      } else if (action === 'set-arch-tab') {
        STATE.archTab = el.getAttribute('data-tab') || 'sql';
        render();
      } else if (action === 'copy-arch-code') {
        const viewer = document.querySelector('.code-viewer');
        if (viewer) copyText(viewer.textContent, 'Copied backend code to clipboard');
      }
    });

    document.addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'hero-prompt-input') {
        STATE.heroPrompt = e.target.value;
      } else if (id === 'reply-triage-input') {
        STATE.replyInput = e.target.value;
        render();
        const el = document.getElementById('reply-triage-input');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      } else if (id === 'sec-purpose-input') {
        const sec = INTAKE_SECTIONS[STATE.activeSecIdx];
        if (sec && STATE.secConfigs[sec.id]) {
          STATE.secConfigs[sec.id].purpose = e.target.value;
        }
      } else if (id === 'agent-draft-input') {
        STATE.draft = e.target.value;
      } else if (id === 'connector-search-input') {
        STATE.query = e.target.value;
        render();
        const el = document.getElementById('connector-search-input');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      } else if (id === 'linter-subj-input') {
        STATE.linterSubject = e.target.value;
        render();
        const el = document.getElementById('linter-subj-input');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      } else if (id === 'linter-body-input') {
        STATE.linterBody = e.target.value;
        render();
        const el = document.getElementById('linter-body-input');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.id === 'agent-draft-input') {
        e.preventDefault();
        submitAgentAnswer(e.target.value);
      } else if (e.key === 'Enter' && e.target.id === 'hero-prompt-input') {
        e.preventDefault();
        const val = e.target.value.trim();
        STATE.screen = 'app';
        STATE.view = 'agent';
        resetAgentChat();
        render();
        if (val) setTimeout(() => submitAgentAnswer(val), 60);
      }
    });

    render();
  </script>
</body>
</html>
